# Pull requests: run every test (version sync, runtime) and require the PR's plugin version to
# be above main's, so two merges never release the same number.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: |
          for dir in . skills/*/cli; do
            [ -f "$dir/package.json" ] || continue
            echo "bun install in $dir"
            if [ -f "$dir/bun.lock" ]; then
              (cd "$dir" && bun install --frozen-lockfile)
            else
              (cd "$dir" && bun install)
            fi
          done
      - name: Test
        run: bun test
      - name: Version above the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/version-check.ts "origin/$BASE_REF"
