# Tags every generator version on main as v<version>, at the first commit of main's first-parent history
# that carries it (.github/scripts/version-tags.sh), so upgrade (SPEC §5) can fetch the Starter code a
# plugin was copied from. A tag is never moved or deleted: a version that already has one is skipped.
name: version-tags

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json, .github/scripts/version-tags.sh, .github/workflows/version-tags.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag every version that has no tag
        # bash -eo pipefail: a failing version-tags.sh fails the job instead of ending the loop quietly.
        shell: bash
        run: |
          .github/scripts/version-tags.sh HEAD | while read -r tag commit; do
            git tag "$tag" "$commit"
            git push origin "refs/tags/$tag"
            echo "tagged $tag at $commit"
          done
