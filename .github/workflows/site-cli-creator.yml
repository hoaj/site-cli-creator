name: site-cli-creator

# The generator's CI (SPEC §5, §9): its own tests, then a platform smoke test of
# the Starter code's compiled CLI on every release target.
# Cost: keep PR runs short; macOS minutes are the slowest to queue. A PR branch runs once
# (pull_request; `push` is main only) and only on linux-x64; main and workflow_dispatch run all
# five targets. Before merging a change to build.ts, install.sh, release.yml or main.ts, run the
# full matrix on the branch: gh workflow run site-cli-creator.yml --ref <branch>.
on:
  push:
    branches: [main]
    paths:
      - skills/**
      - package.json
      - bun.lock
      - tsconfig.json
      - .claude-plugin/**
      - .github/workflows/site-cli-creator.yml
      - .github/scripts/**
  workflow_dispatch:
  pull_request:
    paths:
      - skills/**
      - package.json
      - bun.lock
      - tsconfig.json
      - .claude-plugin/**
      - .github/workflows/site-cli-creator.yml
      - .github/scripts/**

permissions:
  contents: read

concurrency:
  group: site-cli-creator-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3
  GENERATOR: .
  SKILL_DIR: skills/site-cli-creator

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Google Chrome if missing
        run: |
          if [ ! -x /opt/google/chrome/chrome ]; then
            curl -fsSLo chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./chrome.deb
            rm chrome.deb
          fi
          /opt/google/chrome/chrome --version
      - run: bun install --frozen-lockfile
        working-directory: ${{ env.GENERATOR }}
      - name: Type-check the generator (tools, tests, fixture site, Starter plugin scripts)
        run: bun x tsc --noEmit -p .
        working-directory: ${{ env.GENERATOR }}
      - name: Type-check the Starter CLI
        run: bun x tsc --noEmit -p .
        working-directory: ${{ env.SKILL_DIR }}/starter/skill/cli
      - run: bun test
        working-directory: ${{ env.GENERATOR }}

  # Per target, on that target's own runner: scaffold a plugin with the generator's own tools
  # (scaffold-fixture.sh), build its CLI, then run the binary with no node_modules: help,
  # version, the hidden `selftest` (plain fetch, Chrome launch, route.abort), a Task command
  # against the fixture site, and `check --writes`, which launches Chrome headless and
  # intercepts the write with route.abort (SPEC §9). Nothing is uploaded: no artifacts.
  smoke:
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `strategy.matrix` can read `github`, so the event picks the matrix here. A job-level `if`
        # cannot read `matrix`, and a step-level `if` would still start a macOS runner for every
        # skipped target. Trade-off: on a PR only linux-x64 runs, so a darwin, windows or arm64
        # break shows up after the merge, on main (or earlier: workflow_dispatch on the branch).
        # macos-13 was GitHub's last generic Intel image and is retired; macos-15-intel replaces it.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","target":"linux-x64"}]' || '[{"os":"macos-15-intel","target":"darwin-x64"},{"os":"macos-latest","target":"darwin-arm64"},{"os":"ubuntu-latest","target":"linux-x64"},{"os":"ubuntu-24.04-arm","target":"linux-arm64"},{"os":"windows-latest","target":"windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ${{ env.GENERATOR }}
      - name: Scaffold the fixture plugin
        run: bash .github/scripts/scaffold-fixture.sh "$RUNNER_TEMP/smoke-plugin"
      # A binary must not depend on the build machine's paths (build.ts patches playwright-core's
      # package.json and browsers.json lookups for this). The old cross-build proved it by running
      # on another machine; building and running on one runner proves it only if nothing of the
      # build is left behind. So only the binary moves to a clean folder, then the scaffolded
      # plugin (with its CLI's node_modules) and the generator's node_modules are deleted.
      - name: Build fixture-${{ matrix.target }}, keep only the binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          if [ "$TARGET" = windows-x64 ]; then ext=".exe"; fi
          mkdir -p "$RUNNER_TEMP/smoke-bin" "$RUNNER_TEMP/smoke-run"
          (cd "$RUNNER_TEMP/smoke-plugin/skills/fixture/cli" && bun build.ts "bun-$TARGET" "$RUNNER_TEMP/smoke-bin/fixture-$TARGET$ext")
          rm -rf "$RUNNER_TEMP/smoke-plugin" "$GENERATOR/node_modules"
          test ! -e "$RUNNER_TEMP/smoke-plugin"
          ls -la "$RUNNER_TEMP/smoke-bin"
      # The arm64 runner image ships no Google Chrome; macOS and Windows runners have it.
      - name: Install Google Chrome (linux-arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          curl -fsSLo chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
          sudo apt-get install -y ./chrome.deb
          rm chrome.deb
      - name: Prepare the binary as install.sh does
        working-directory: ${{ runner.temp }}/smoke-run
        run: |
          bin="$RUNNER_TEMP/smoke-bin/fixture-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then
            bin="$bin.exe"
            powershell -NoProfile -Command "Unblock-File -Path '$bin'" || true
          else
            chmod +x "$bin"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            xattr -d com.apple.quarantine "$bin" 2>/dev/null || true
            codesign -v "$bin" 2>/dev/null || codesign --force --sign - "$bin"
            codesign -v "$bin"
          fi
          test ! -e node_modules
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: help, version, fetch, Chrome launch and route.abort
        working-directory: ${{ runner.temp }}/smoke-run
        run: |
          is_json_object() {
            if command -v jq > /dev/null; then
              jq -e 'type == "object"' "$1" > /dev/null
            else
              python3 -c 'import json, sys; assert isinstance(json.load(open(sys.argv[1])), dict)' "$1"
            fi
          }
          run() {
            local out="$1"
            shift
            echo "::group::$*"
            "$BIN" "$@" > "$out"
            is_json_object "$out"
            cat "$out"
            echo "::endgroup::"
          }
          run help.json help
          run version.json version
          bun "$GITHUB_WORKSPACE/$SKILL_DIR/fixtures/site/server.ts" --auth none --port 4310 > server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fs -o /dev/null http://127.0.0.1:4310/ && break
            sleep 0.2
          done
          # Hidden built-in: plain fetch, Chrome launched headless (temp profile, channel chrome),
          # one request routed and aborted with net::ERR_FAILED.
          run selftest.json selftest --url http://127.0.0.1:4310/
          if command -v jq > /dev/null; then
            jq -e '.ok == true and (.fetch | type) == "number" and .chrome == true and .abort == true' selftest.json > /dev/null
          else
            python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r.get("ok") is True and isinstance(r.get("fetch"), int) and r.get("chrome") is True and r.get("abort") is True, r' selftest.json
          fi
          run show.json subscription show
          run check.json check --writes
          if command -v jq > /dev/null; then
            jq -e '.ok == true and ([.operations[] | select(.effect == "write" and .status == "ok")] | length) > 0' check.json > /dev/null
          fi

  # Remote mode's image, built from a scaffolded fixture plugin the way the Owner builds it on a
  # host (`docker build` in the CLI skill's folder). There is no Docker on the maintainer's Mac, so
  # a broken Dockerfile would otherwise first show up on Railway.
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ${{ env.GENERATOR }}
      - name: Scaffold the fixture plugin
        run: |
          bash .github/scripts/scaffold-fixture.sh "$RUNNER_TEMP/docker-plugin"
          echo "PLUGIN_DIR=$RUNNER_TEMP/docker-plugin" >> "$GITHUB_ENV"
      - name: Build the image
        run: docker build -t fixture-remote "$PLUGIN_DIR/skills/fixture"
      - name: Run it and check /healthz, the OAuth metadata and /setup
        run: |
          docker run -d --name fixture-remote -p 8080:8080 \
            -e OWNER_PASSWORD=ci-owner-password -e PUBLIC_URL=http://localhost:8080 fixture-remote
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          resource=$(curl -fsS http://localhost:8080/.well-known/oauth-protected-resource/mcp | jq -r .resource)
          test "$resource" = "http://localhost:8080/mcp"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/setup)" = 200
      - name: Container logs
        if: failure()
        run: docker logs fixture-remote
