# A merge to main whose logbuy version has no tag yet releases it: build every CLI skill for
# every target, publish release logbuy-vX.Y.Z with the binaries, then label the issues the
# released PRs fixed with fixed-in:logbuy-vX.Y.Z. A failed build shows up as a red run on main.
# The repo holds other plugins, so tags carry the plugin's name and every path is under
# plugins/logbuy.
name: logbuy-release

on:
  push:
    branches: [main]
    paths:
      - plugins/logbuy/**
      - .github/workflows/logbuy-release.yml

permissions: {}

# One group per commit: a single shared group cancels a run still waiting for the one in
# progress, and the version it carried would never be released. Each run releases its own
# commit's version (actions/checkout checks out github.sha); `publish` is serialised per version
# and skips a release that exists, so two runs of one version publish it once.
concurrency:
  group: logbuy-release-${{ github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"
  PLUGIN_DIR: plugins/logbuy
  TAG_PREFIX: logbuy-v

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/logbuy
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      skills: ${{ steps.skills.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Read the plugin version and look for its tag
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          tag="$TAG_PREFIX$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          # Pathspecs and "<rev>:./<path>" are relative to this folder, the plugin root.
          cli=('skills/*/cli/src/*' 'skills/*/cli/package.json' 'skills/*/cli/build.ts')
          parent=""
          if git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
            parent="$(git show 'HEAD^:./.claude-plugin/plugin.json' 2>/dev/null | jq -r .version 2>/dev/null || true)"
          fi
          # Two PRs that bumped to the same version can both merge when the second was not
          # rebased. Its CLI changes would then never get a binary, so fail loudly instead,
          # whether or not the first one's release exists yet.
          changed=""
          if [ "$parent" = "$version" ]; then
            changed="$(git diff --name-only 'HEAD^' HEAD -- "${cli[@]}")"
          elif git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            changed="$(git diff --name-only "$tag" HEAD -- "${cli[@]}")"
          fi
          if [ -n "$changed" ]; then
            echo "::error::main changed logbuy CLI code in $tag without a version bump: open a PR that runs \`bun run bump patch\` in $PLUGIN_DIR. Changed: $(echo "$changed" | tr '\n' ' ')"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released: nothing to do"
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi
      - id: skills
        name: List the CLI skills
        run: |
          skills="$(find skills -mindepth 2 -maxdepth 2 -type d -name cli | cut -d/ -f2 | sort | jq -Rnc '[inputs]')"
          echo "skills=$skills" >>"$GITHUB_OUTPUT"
          echo "CLI skills: $skills"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        skill: ${{ fromJSON(needs.plan.outputs.skills) }}
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64]
    defaults:
      run:
        working-directory: plugins/logbuy/skills/${{ matrix.skill }}/cli
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi
      - name: Build
        env:
          SKILL: ${{ matrix.skill }}
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          if [ "$TARGET" = windows-x64 ]; then ext=".exe"; fi
          bun build.ts "bun-$TARGET" "dist/$SKILL-$TARGET$ext"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.skill }}-${{ matrix.target }}
          path: plugins/logbuy/skills/${{ matrix.skill }}/cli/dist/${{ matrix.skill }}-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: logbuy-publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG was published by an earlier run of the same version: nothing to do"
            exit 0
          fi
          # --latest=false: the repo's "Latest" release is not any one plugin's.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "logbuy v$VERSION" --generate-notes --latest=false

  fixed-in:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Label the issues this release fixed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        # From the repo root: --dir is a git pathspec, which git reads relative to the shell's folder.
        run: |
          git fetch --tags --force origin
          bun "$PLUGIN_DIR/scripts/fixed-in.ts" "$TAG" --repo "$GITHUB_REPOSITORY" --branch main --dir "$PLUGIN_DIR"
